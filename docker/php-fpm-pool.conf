[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 15
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Capture stdout/stderr from PHP worker processes (e.g. var_dump, uncaught fatals)
; and send them to the pool's error log instead of being discarded.
catch_workers_output = yes
decorate_workers_output = no

; Route PHP-level errors (fatals, warnings) to stderr so Render's log stream picks them up
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
